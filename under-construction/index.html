<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Oishee Rahman</title>
  <style>
    :root { --bg: #ffffff; --ink: #0a0a0a; --mute: #71717a; --rule: #e4e4e7; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f0f10; --ink: #f4f4f5; --mute: #a1a1aa; --rule: #27272a; }
    }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 0 16px; text-align: center;
    }
    h1 { font-size: 1.75rem; font-weight: 600; margin: 0 0 0.5rem; }
    p { color: var(--mute); margin: 0; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.9rem;
        border-top: 1px solid var(--rule); padding-top: 0.75rem; }
  </style>
</head>
<body>
  <main>
    <h1>Oishee Rahman</h1>
    <p>Under construction</p>
  </main>
</body>
</html>
